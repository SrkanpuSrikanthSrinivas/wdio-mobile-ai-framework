# .aider.conf.yml — loaded automatically when aider starts in this repo.
# Every prompt gets the rules, the app's real locators and the shared helpers
# as read-only context; every edit is checked and committed.
read:
  - CONVENTIONS.md
  - APP-MAP.md
  - test/screenobjects/screen.js
  - test/helpers/data.js
test-cmd: npm run validate
auto-test: true
auto-commits: true
gitignore: false
map-tokens: 512
max-chat-history-tokens: 1024
