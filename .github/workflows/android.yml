# Runs the mobile tests on a real Android emulator in GitHub's cloud.
# Nothing runs on your laptop and there's no device-farm account. On every push
# (or "Run workflow"), this boots an emulator, runs your AI-edited tests, and
# uploads a VIDEO of the phone plus logs/screenshots as artifacts.
#
# NOTE: GitHub Actions only runs when the repo is hosted on GitHub. If your repo
# lives on GitLab, push a copy (or a mirror) to GitHub to use this.

name: Android E2E (emulator in the cloud)

on:
  push:
  workflow_dispatch:      # lets you run it on demand from the Actions tab

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project + Appium
        run: |
          npm install
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p screenshots
            # record the phone screen so you get a video to show
            adb shell screenrecord --time-limit 170 /sdcard/demo.mp4 & REC=$!
            # start Appium in the background
            nohup appium --address 127.0.0.1 -p 4723 --base-path / > appium.log 2>&1 &
            node scripts/wait-for-appium.mjs
            # run the same tests you edited with the AI
            APPIUM_HOST=127.0.0.1 npm run android || echo "tests failed (kept for artifacts)"
            # stop the recording and pull the video off the phone
            sleep 2; kill $REC 2>/dev/null || true; sleep 4
            adb pull /sdcard/demo.mp4 ./demo.mp4 || true

      - name: Upload results (video, logs, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results
          path: |
            demo.mp4
            appium.log
            screenshots/
          if-no-files-found: ignore
